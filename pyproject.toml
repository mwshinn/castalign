[project]
name = "castalign"
authors = [{name = "Max Shinn", email = "m.shinn@ucl.ac.uk"}]
maintainers = [{name = "Max Shinn", email = "m.shinn@ucl.ac.uk"}]
description = "Coppafish, Antibody Staining, and Two-photon alignment: 3D alignment framework for microscopy and in vivo imaging"
readme = "README.md"
requires-python = ">=3.11.0"
dynamic = ["version"]

dependencies = [
  "numpy",
  "scipy",
  "napari",
  "magicgui",
  "scikit-image",
  "imageio",
  "imageio-ffmpeg",
  "threadpoolctl",
  "pyqt6",
]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
"Homepage" = "https://github.com/mwshinn/castalign"
"Documentation" = "https://castalign.readthedocs.io/en/latest/"
"Publication" = "https://doi.org/10.64898/2026.05.15.725413"
"Bug Tracker" = "https://github.com/mwshinn/castalign/issues"
"Source Code" = "https://github.com/mwshinn/castalign"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "tox",
  "mypy",
  "pre-commit",
  "ruff",
  "setuptools-scm",
]

[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["castalign*"]
exclude = ["tests*", "docs*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
# `-p no:napari -p no:npe2`: napari and npe2 (a napari dependency) each
# register their own pytest plugin, and both trigger pydantic deprecation
# warnings from inside those packages: napari's from an autouse fixture before
# every test, npe2's when pytest imports the plugin (pytest>=9.2 filters
# warnings at that stage too; pytest#12697). The "error" filter below turns
# these into errors. castalign's tests use neither plugin's fixtures, so both
# are disabled. If GUI tests needing napari fixtures (e.g. make_napari_viewer)
# are added and napari still hasn't updated their deprecated code, these flags
# should be removed and the specific warning should be ignored instead.
addopts = "--cov=castalign -p no:napari -p no:npe2"
filterwarnings = [
    "error",
]
